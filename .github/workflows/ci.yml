name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tarot-app/package-lock.json
            tarot-app/client/package-lock.json
      - name: Install API dependencies
        working-directory: tarot-app
        run: npm ci
      - name: Install client dependencies
        working-directory: tarot-app/client
        run: npm ci
      - name: Verify
        working-directory: tarot-app
        run: npm run check
